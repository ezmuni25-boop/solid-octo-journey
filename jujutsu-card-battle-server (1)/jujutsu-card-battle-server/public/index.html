    } else {
      var mineTurn = isMine(b.turn), acts = '';
      for (var i = 0; i < ACTIONS_PER_TURN; i++) acts += '<i class="act' + (i < b.actions ? ' on' : '') + '"></i>';
      var shortMsg = T(b.msg), lg = b.log || [];
      panel = '<div class="seam-panel mini"><div class="turn-row"><span class="d-player p' + D(b.turn) + '">' + nm(b.turn) + '’s turn</span>' +
        '<span class="acts" role="img" aria-label="' + b.actions + ' of ' + ACTIONS_PER_TURN + ' actions left"><span class="acts-n">' + b.actions + '<small>/' + ACTIONS_PER_TURN + '</small></span>' + acts + '</span>' +
        (!mineTurn ? '' : b.pending ? (b.pending.multi ? '<button type="button" class="btn" data-confirm' + (b.pending.sel.length ? '' : ' disabled') + '>Confirm' + (b.pending.sel.length ? ' (' + b.pending.sel.length + ')' : '') + '</button>' : '') + '<button type="button" class="btn ghost" data-cancel>Cancel</button>' : '<button type="button" class="btn" data-end>End turn</button>') +
        (lg.length ? '<button type="button" class="log-btn" data-log aria-expanded="' + logOpen + '">Log</button>' : '') +
        '</div><p class="seam-msg mini" aria-live="polite">' + shortMsg + '</p></div>';
      if (logOpen && lg.length) panel += '<div class="log-pop" data-log-pop>' + lg.slice(-8).reverse().map(function (e) { return '<p>' + T(e.t) + '</p>'; }).join('') + '</div>';
    }
    arena.innerHTML = '<button type="button" class="btn ghost arena-menu" data-nav="menu">Main menu</button>' + banner + half(2) + '<i class="seam-line"></i>' + panel + half(1) + (b.info ? ruleOverlayHTML(b) : '');
    // the die is redrawn on every snapshot, so the shuffling pips are a cosmetic loop over the new element
    if (rollingDie) {
      var el = arena.querySelector('.die');
      if (el) dieTimer = setInterval(function () { el.innerHTML = pipsHTML(1 + Math.floor(Math.random() * 6)); }, 90);
    }
  }

  /* ----- open card view ----- */
  function bzLayout() {
    var vw = window.innerWidth, vh = window.innerHeight, pad = 16;
    if (vw >= 900) {
      var optW = 270, cetW = 120, gap = 22;
      var h = Math.min(vh - 2 * pad, 640), w = h * ASPECT;
      var maxW = vw - 2 * (Math.max(optW, cetW + 18) + gap + pad);
      if (w > maxW) { w = Math.max(240, maxW); h = w / ASPECT; }
      var left = (vw - w) / 2, top = (vh - h) / 2;
      return { compact: false, float: canHover, card: { left: left, top: top, width: w, height: h },
        opts: { left: left - gap - optW, top: pad, width: optW, height: vh - 2 * pad },
        cet: { left: left + w - 18, top: top, width: cetW + 18, height: h } };
    }
    var ch = Math.min(vh * 0.42, 400), cw = Math.min(ch * ASPECT, (vw - 2 * pad) * 0.6);
    ch = cw / ASPECT;
    var cl = pad + cw - 14, ot = pad + ch + 12;
    return { compact: true, float: false, card: { left: pad, top: pad, width: cw, height: ch },
      cet: { left: cl, top: pad, width: vw - pad - cl, height: ch },
      opts: { left: pad, top: ot, width: vw - 2 * pad, height: Math.max(150, vh - ot - pad) } };
  }

  function openBZ(id, srcEl) {
    if (bzs || !battle) return;
    hidePeek();
    var c = cardDef(id), from = srcEl.getBoundingClientRect();
    var big = document.createElement('button');
    big.type = 'button'; big.className = 'bz-card';
    big.setAttribute('aria-label', 'Close ' + c.name);
    big.innerHTML = '<img src="' + c.src + '" alt="' + c.alt + '">';
    place(big, from);
    var cet = document.createElement('div'); cet.className = 'bz-cet';
    var opts = document.createElement('aside'); opts.className = 'bz-opts'; opts.setAttribute('aria-label', c.name + ' actions');
    var Lo = bzLayout();
    place(cet, Lo.cet); place(opts, Lo.opts);
    cet.classList.toggle('compact', Lo.compact); opts.classList.toggle('compact', Lo.compact); opts.classList.toggle('float', Lo.float);
    bzEl.appendChild(cet); bzEl.appendChild(opts); bzEl.appendChild(big);
    bzs = { id: id, big: big, cet: cet, opts: opts, closing: false };
    big.addEventListener('click', closeBZ);
    fillBZ();
    renderBattle(); // hides the source card while its copy is open
    bzEl.hidden = false;
    big.offsetWidth; // let the start position apply before animating
    bzEl.classList.add('open');
    place(big, Lo.card);
    var cb = opts.querySelector('[data-bzclose]');
    if (cb) cb.focus({ preventScroll: true });
  }

  var TIP_DEFAULT = '<span class="tip-sub">Hover an option to see what it does and what it needs.</span>';
  function setTip(ev) {
    if (!bzs || !bzs.tips) return;
    var w = ev.target.closest && ev.target.closest('.opt-wrap');
    var tip = bzs.opts.querySelector('.opt-tip');
    if (tip) tip.innerHTML = w ? bzs.tips[w.getAttribute('data-tip')] : TIP_DEFAULT;
  }
  bzEl.addEventListener('mouseover', setTip);
  bzEl.addEventListener('focusin', setTip);
  bzEl.addEventListener('mouseout', function (ev) { if (ev.target.closest && ev.target.closest('.opt-list') && !(ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('.opt-list'))) setTip({ target: document.body }); });

  function fillBZ() {
    if (!bzs || !battle) return;
    var b = battle, s = b.cards[bzs.id], c = cardDef(s.id), mine = b.phase === 'play' && b.turn === s.p && isMine(s.p);
    var h = '<div class="bz-head"><span class="d-player p' + D(s.p) + '">' + nm(s.p) + '</span><h2>' + c.name + '</h2><div class="bz-meta"><span class="bz-hp">HP <b>' + s.hp + '</b> / ' + s.max + '</span>' +
      (mine ? '<span class="bz-act">Actions left <b>' + b.actions + '</b> / ' + ACTIONS_PER_TURN + '</span>' : '') + '</div></div><div class="opt-list">';
    bzs.tips = {};
    OPTS.forEach(function (k) {
      var o = optInfo(b, s, k);
      if (!isMine(s.p) && !o.why) o.why = 'This is your opponent’s card';
      o.why = T(o.why);
      bzs.tips[k] = '<b class="tip-h">' + o.label + (o.cost ? ' <span class="tip-cost">' + o.cost + '</span>' : '') + '</b><span class="tip-sub">' + o.sub + '</span>' +
        (o.fx ? '<span class="tip-fx">' + o.fx + '</span>' : '') + (o.why ? '<span class="tip-why">Can’t use right now: ' + o.why + '</span>' : '<span class="tip-ok">Ready to use</span>');
      h += '<div class="opt-wrap' + (o.why ? ' off' : '') + '" data-tip="' + k + '"><button type="button" class="opt" data-opt="' + k + '"' + (o.why ? ' disabled' : '') + '>' +
        '<span class="opt-label">' + o.label + '</span>' + (o.cost ? '<span class="opt-cost">' + o.cost + '</span>' : '<span></span>') +
        '<span class="opt-sub">' + o.sub + '</span>' + (o.fx ? '<span class="opt-fx">' + o.fx + '</span>' : '') + (o.why ? '<span class="opt-why">' + o.why + '</span>' : '') + '</button></div>';
    });
    h += '</div><div class="opt-tip" aria-live="polite">' + TIP_DEFAULT + '</div><button type="button" class="btn ghost bz-close" data-bzclose>Close</button>';
    bzs.opts.innerHTML = h;

    var d = '', n = Math.min(s.cet, 24);
    for (var i = 0; i < n; i++) d += '<img class="bz-disc" src="cards/cet.png" alt="">';
    var mhz = battle.cards['perfect-soul'], ttChip = mhz && !mhz.dead && s.p !== mhz.p ? '<span class="token-chip" style="color:' + TOKENS.tt.color + '" title="Transfiguration Tokens">TT ' + s.tok.tt + '</span>' : '';
    var chips = ttChip + (c.tokens || []).filter(function (t) { return t !== 'tt'; }).map(function (t) {
      return '<span class="token-chip" style="color:' + TOKENS[t].color + '" title="' + TOKENS[t].name + '">' + TOKENS[t].abbr + ' ' + s.tok[t] + '</span>';
    }).join('');
    bzs.cet.innerHTML = '<div class="bz-cet-head"><span class="bz-cet-label">CET</span><span class="bz-cet-n">' + s.cet + '</span></div>' +
      '<div class="bz-discs" role="img" aria-label="' + s.cet + ' CET">' + (s.cet ? d : '<span class="bz-none">No CET yet</span>') + '</div>' +
      (chips ? '<div class="bz-chips">' + chips + '</div>' : '');
  }

  function closeBZ() {
    if (!bzs || bzs.closing) return;
    var cur = bzs;
    cur.closing = true;
    bzEl.classList.remove('open');
    var src = arena.querySelector('.b-card[data-id="' + cur.id + '"]');
    if (src) place(cur.big, src.getBoundingClientRect());
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      resetBZ();
      if (battle && currentScreen === 'battle') renderBattle();
      var back = arena.querySelector('.b-card[data-id="' + cur.id + '"]');
      if (back) back.focus({ preventScroll: true });
    }
    cur.big.addEventListener('transitionend', function (e) { if (e.propertyName === 'width') finish(); });
    setTimeout(finish, 500);
  }
  function resetBZ() {
    bzEl.classList.remove('open');
    [].slice.call(bzEl.querySelectorAll('.bz-card, .bz-cet, .bz-opts')).forEach(function (n) { n.remove(); });
    bzEl.hidden = true;
    bzs = null;
  }

  // Which seat a click acts for. Online it is always you; local play has one screen for both seats.
  function seatFor(kind) {
    if (online()) return sess.me;
    var b = battle;
    if (kind === 'die') return b.dice ? b.dice.items[Math.min(b.dice.idx, b.dice.items.length - 1)].p : (b.rolls[1] === null ? 1 : 2);
    if (kind === 'answer') return b.pick.who;
    if (kind === 'ack') return b.info.who;
    return b.turn;
  }

  arena.addEventListener('click', function (ev) {
    if (!battle) return;
    if (ev.target.closest('[data-die]')) { send(battle.dice ? { t: 'die' } : { t: 'roll' }, seatFor('die')); return; }
    if (ev.target.closest('[data-coin]')) { send({ t: 'coin' }, 1); return; }
    if (ev.target.closest('[data-info-ok]')) { if (battle.info) send({ t: 'ack' }, seatFor('ack')); return; }
    if (ev.target.closest('[data-endview]')) { endHidden = !endHidden; renderBattle(); return; }
    if (ev.target.closest('[data-log]')) { logOpen = !logOpen; renderBattle(); return; }
    if (logOpen && !ev.target.closest('[data-log-pop]')) { logOpen = false; renderBattle(); }
    if (battle.info) return;
    var pb = ev.target.closest('[data-pick]');
    if (pb) { if (battle.pick) send({ t: 'answer', k: pb.getAttribute('data-pick') }, seatFor('answer')); return; }
    if (ev.target.closest('[data-confirm]')) { send({ t: 'confirm' }, seatFor('turn')); return; }
    if (battle.dice || battle.coin || battle.pick) return;
    if (ev.target.closest('[data-end]')) { if (!bzs) send({ t: 'end' }, seatFor('turn')); return; }
    if (ev.target.closest('[data-cancel]')) { send({ t: 'cancel' }, seatFor('turn')); return; }
    var c = ev.target.closest('.b-card');
    if (!c) return;
    var pd = battle.pending, cid = c.getAttribute('data-id');
    if (pd) {
      if (!isMine(battle.turn)) return;
      if (pd.pool.indexOf(cid) > -1) send({ t: 'target', id: cid }, seatFor('turn'));
      else toast('Pick one of the glowing cards, or cancel.');
      return;
    }
    openBZ(cid, c);
  });
  bzEl.addEventListener('click', function (ev) {
    var o = ev.target.closest('[data-opt]');
    if (o) {
      if (!o.disabled && bzs && !bzs.closing) {
        var id = bzs.id, key = o.getAttribute('data-opt');
        closeBZ();
        send({ t: 'perform', id: id, key: key }, battle.cards[id].p);
      }
      return;
    }
    if (ev.target.closest('[data-bzclose]') || ev.target === bzBackdrop) closeBZ();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (draft && pendingPick) { pendingPick = null; renderDraft(); }
      else if (battle && battle.pending && isMine(battle.turn)) send({ t: 'cancel' }, seatFor('turn'));
      else closeBZ();
    }
  });
  window.addEventListener('resize', function () {
    if (!bzs || bzs.closing) return;
    var Lo = bzLayout();
    place(bzs.big, Lo.card); place(bzs.cet, Lo.cet); place(bzs.opts, Lo.opts);
    bzs.cet.classList.toggle('compact', Lo.compact); bzs.opts.classList.toggle('compact', Lo.compact); bzs.opts.classList.toggle('float', Lo.float);
  });

  /* ================================================================================================
     SESSIONS: where the match server runs and how screens reach it.
     Local Play: the server lives in this page and this one screen plays both seats.
     Online: the HOST's page runs the server (the only place the game state is ever changed) and writes each
     snapshot to the shared db at srv/<host id>. The GUEST's page only reads that document and writes
     requests under req/<guest id>/q. The db access rules (see the Artifact's capabilities) let a player write
     only inside their own srv/ and req/ folder, so the guest's page cannot edit the host's snapshot at all.
     ================================================================================================ */
  function endSession() {
    if (sess) { var s = sess; sess = null; try { s.destroy(); } catch (e) {} }
    resetViews();
    $('net-bar').hidden = true;
  }
  function startLocal() {
    endSession();
    var names = ['Player 1', 'Player 2'];
    var engine = createEngine({ online: false, names: names, publish: function (st) { applyState(st); } });
    sess = { mode: 'local', me: null, names: names, send: function (a, seat) { return engine.request(seat || 1, a); }, destroy: function () { engine.destroy(); } };
    engine.start();
  }

  // Online: the game server runs the match. This page only sends requests and draws the state it receives.
  function startOnline(v) {
    endSession();
    var ch = rooms.channel(), pl = v.match && v.match.players;
    if (!ch || !pl) { leaveToMenu('Could not start the match.'); return; }
    var names = [pl[0].name, pl[1].name];
    sess = { mode: 'online', me: v.role === 'host' ? 1 : 2, names: names,
      send: function (a) { return ch.act(a).then(function (r) { if (r && r.gone) leaveToMenu('The room no longer exists.'); return r; }); },
      destroy: function () { ch.onState(null); } };
    ch.onState(function (st) { applyState(st); });
  }

  /* ---------- menu: username, Play drop-down, rooms ---------- */
  var rooms = ServerRooms.create();
  function leaveAll() { rooms.leaveRoom(); }
  var $ = function (id) { return document.getElementById(id); };
  var uInput = $('username');
  try { var savedName = localStorage.getItem('jcb-username'); if (savedName) uInput.value = rooms.cleanName(savedName); } catch (e) {}
  uInput.addEventListener('input', function () {
    try { localStorage.setItem('jcb-username', rooms.cleanName(uInput.value)); } catch (e) {}
    $('menu-note').textContent = '';
  });
  function username() { return rooms.cleanName(uInput.value); }
  function menuNote(t) { $('menu-note').textContent = t || ''; }

  function setPlayMenu(open) {
    $('menu-list').classList.toggle('rooms', open);
    $('m-play').textContent = open ? 'Back' : 'Play';
    $('m-play').setAttribute('aria-expanded', open ? 'true' : 'false');
    var drop = ['m-local', 'm-create', 'm-join'], keep = document.querySelectorAll('#menu-list > .btn:not(.drop):not(#m-play)');
    drop.forEach(function (id) { $(id).hidden = !open; });
    Array.prototype.forEach.call(keep, function (b) { b.hidden = open; });
    menuNote('');
  }
  $('m-play').addEventListener('click', function () { setPlayMenu(!$('menu-list').classList.contains('rooms')); });
  $('m-local').addEventListener('click', function () { startLocal(); });


  function needName() {
    if (username()) return true;
    menuNote('Enter a username first.');
    uInput.focus();
    return false;
  }
  var roomBusy = false;
  async function guarded(btn, fn) {
    if (roomBusy) return;
    roomBusy = true; btn.disabled = true;
    try { await fn(); } finally { roomBusy = false; btn.disabled = false; }
  }
  $('m-create').addEventListener('click', function () {
    if (!needName()) return;
    guarded($('m-create'), async function () {
      menuNote('Creating room…');
      var r = await rooms.createRoom(username());
      if (!r.ok) { menuNote(r.message); return; }
      menuNote(''); show('lobby'); renderRoom(rooms.view());
    });
  });
  $('m-join').addEventListener('click', function () {
    if (!needName()) return;
    $('join-err').textContent = ''; $('join-code').value = '';
    show('join'); $('join-code').focus();
  });
  $('join-code').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 6); $('join-err').textContent = ''; });
  $('join-back').addEventListener('click', function () { show('menu'); setPlayMenu(true); });
  $('join-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var code = $('join-code').value;
    if (!rooms.isCode(code)) { $('join-err').textContent = 'Room codes are exactly 6 digits.'; return; }
    guarded($('join-go'), async function () {
      $('join-err').textContent = 'Joining…';
      var r = await rooms.joinRoom(code, username());
      if (!r.ok) { $('join-err').textContent = r.message; return; }
      $('join-err').textContent = ''; show('lobby'); renderRoom(rooms.view());
    });
  });

  /* ---------- lobby and match placeholder ---------- */
  var CLOSE_TEXT = {
    'host-left': 'The host closed the room.', 'host-disconnected': 'The host disconnected, so the room was closed.',
    removed: 'The room no longer exists.', expired: 'The room expired.', 'all-left': 'Everyone left, so the room was closed.',
    server: 'Lost connection to the room.', closed: 'The room was closed.'
  };
  function slotCard(p) {
    var d = document.createElement('div');
    d.className = 'ls-slot p' + p.slot + (p.name ? '' : ' empty');
    var role = document.createElement('span'); role.className = 'ls-role'; role.textContent = 'Player ' + p.slot + ' (' + p.label + ')';
    var nm = document.createElement('div'); nm.className = 'ls-name'; nm.textContent = p.name || 'Waiting for Player';
    if (p.name && p.isMe) { var you = document.createElement('span'); you.className = 'ls-you'; you.textContent = '  you'; nm.appendChild(you); }
    var cn = document.createElement('span');
    cn.className = 'ls-conn ' + (!p.name ? 'wait' : p.connected ? 'on' : 'off');
    cn.textContent = !p.name ? 'Empty' : p.connected ? 'Connected' : 'Disconnected';
    d.appendChild(role); d.appendChild(nm); d.appendChild(cn);
    return d;
  }
  function fillSlots(box, v) {
    box.textContent = '';
    v.players.forEach(function (p) { box.appendChild(slotCard(p)); });
  }
  function leaveToMenu(note) {
    leaveAll();
    show('menu'); setPlayMenu(true);
    menuNote(note || '');
  }
  function netStatus(v) {
    var bar = $('net-bar');
    if (!online()) { bar.hidden = true; return; }
    var host = v.role === 'host', other = v.players[host ? 1 : 0], who = sess.names[host ? 1 : 0], msg = '';
    if (v.opponentLeft) msg = who + ' left the match.';
    else if (!other.connected) msg = who + ' disconnected.';
    if (msg) msg += ' The match cannot continue without them.';
    bar.textContent = msg; bar.hidden = !msg;
  }
  function renderRoom(v) {
    if (!v || v.loading) return;
    var cur = currentScreen;
    var inMatch = cur === 'play' || cur === 'battle' || cur === 'match';
    if (cur !== 'lobby' && !inMatch) return;
    if (v.closed) { leaveToMenu(CLOSE_TEXT[v.closed] || CLOSE_TEXT.closed); return; }
    if (cur === 'lobby') {
      if (v.match) { show('match'); startOnline(v); return; }
      $('lobby-code').textContent = v.code;
      fillSlots($('lobby-slots'), v);
      var opp = v.players[1];
      $('lobby-status').textContent = !opp.name ? 'Waiting for an opponent to join. Share the code above.'
        : !opp.connected ? 'Opponent is not connected.' : v.role === 'host' ? 'Opponent joined. Ready when you are.' : 'Waiting for the host to start the match…';
      $('lobby-start').hidden = v.role !== 'host';
      $('lobby-start').disabled = !v.canStart;
    } else netStatus(v);
  }
  rooms.onChange(renderRoom);
  $('lobby-start').addEventListener('click', function () {
    guarded($('lobby-start'), async function () {
      $('lobby-err').textContent = '';
      var r = await rooms.startMatch();
      if (!r.ok) $('lobby-err').textContent = r.message;
    });
  });
  $('lobby-copy').addEventListener('click', function () {
    var b = $('lobby-copy'), code = $('lobby-code').textContent;
    var done = function (t) { b.textContent = t; setTimeout(function () { b.textContent = 'Copy code'; }, 1400); };
    try { navigator.clipboard.writeText(code).then(function () { done('Copied'); }, function () { done('Select and copy'); }); } catch (e) { done('Select and copy'); }
  });
  $('lobby-leave').addEventListener('click', function () { leaveToMenu(''); });
  $('match-leave').addEventListener('click', function () { leaveToMenu(''); });
  window.addEventListener('pagehide', function () { leaveAll(); });

  show('menu');
})();
</script>
