<title>Jujutsu Card Battle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: menu, card picking, battle and card info screens, shown one at a time. Single dark look by choice.
   Card Info: a grid of cards; clicking one lifts it left of center with a role/style panel to its right. */
:root {
  --bg: #0d1218;
  --table: #121a23;
  --line: #26323f;
  --fg: #e4e8ef;
  --muted: #8c98a8;
  --accent: #8793ff;
  --f-title: "Anton", Impact, "Arial Narrow", sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.4;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 12px; }
h1, h2 { font-family: var(--f-title); font-weight: 400; letter-spacing: .03em; text-transform: uppercase; margin: 0; text-wrap: balance; }

.screen { display: grid; gap: 12px; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: 28px; }
.panel { background: var(--table); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 240px; display: grid; place-items: center; text-align: center; color: var(--muted); }

.menu { display: grid; justify-items: center; text-align: center; gap: 14px; padding-block: clamp(32px, 14vh, 120px) 24px; }
.logo { font-size: clamp(44px, 12vw, 84px); line-height: 1; }
.menu-list { display: grid; gap: 10px; width: 100%; max-width: 320px; margin-top: 18px; }

.btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 8px; padding: 10px 16px; border: 1px solid var(--accent); background: var(--accent); color: #0d1030; min-height: 44px; }
.btn:disabled { opacity: .4; cursor: not-allowed; border-color: var(--line); }
.btn:hover:not(:disabled) { filter: brightness(1.15); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.btn.big { width: 100%; font-size: 17px; padding: 14px 18px; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.alt { background: transparent; color: var(--fg); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); padding: 6px 12px; min-height: 0; font-weight: 600; font-size: 13px; }
.btn.big small { font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .04em; }

/* card info */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 220px)); gap: 20px 16px; justify-content: start; padding: 8px 4px; }
.card-item { display: grid; gap: 8px; min-width: 0; }
.card-thumb { display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; border-radius: 4.5%; cursor: pointer; aspect-ratio: 750 / 1050; transition: transform .18s ease, box-shadow .18s ease, filter .18s ease; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
.card-thumb img { display: block; width: 100%; height: 100%; border-radius: 4.5%; }
.card-thumb:hover { transform: translateY(-6px) scale(1.05); box-shadow: 0 0 0 2px var(--accent), 0 14px 30px rgba(0,0,0,.6), 0 0 22px rgba(135,147,255,.45); filter: brightness(1.06); }
.card-thumb:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.card-thumb.lifted { visibility: hidden; }
.card-name { font-size: 13px; color: var(--muted); text-align: center; }

/* enlarged card view */
.zoom { position: fixed; inset: 0; z-index: 10; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.zoom[hidden] { display: none; }
.zoom-backdrop { position: absolute; inset: 0; background: rgba(5, 8, 12, .84); opacity: 0; transition: opacity .3s ease; }
.zoom.open .zoom-backdrop { opacity: 1; }
.zoom-card { position: fixed; margin: 0; padding: 0; border: 0; background: none; cursor: zoom-out; border-radius: 4.5%; box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 40px rgba(135,147,255,.35); transition: left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), width .38s cubic-bezier(.2,.8,.2,1), height .38s cubic-bezier(.2,.8,.2,1); }
.zoom-card img { display: block; width: 100%; height: 100%; border-radius: 4.5%; }
.zoom-card:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

.zoom-info { position: fixed; overflow-y: auto; background: var(--table); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 18px; opacity: 0; transition: opacity .2s ease; }
.zoom.open .zoom-info { opacity: 1; transition: opacity .3s ease .22s; }
.zoom-info h2 { font-size: 30px; line-height: 1.05; }
.info-block { display: grid; gap: 8px; }
.info-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.info-row { display: flex; gap: 14px; align-items: center; }
.info-row > div { min-width: 0; }
.info-row b { display: block; font-size: 17px; }
.info-row p { margin: 2px 0 0; color: #c3cbd6; font-size: 14px; }
.info-none { margin: 0; color: var(--muted); font-size: 14px; }
.token { border-top: 1px solid var(--line); padding-top: 16px; gap: 8px; }
.token-head { display: flex; align-items: center; gap: 10px; }
.token-head b { font-size: 17px; }
.token-chip { font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: .04em; padding: 3px 8px; border-radius: 6px; border: 1.5px solid currentColor; background: rgba(255,255,255,.05); }
.token-text { margin: 0; color: var(--fg); font-size: 14px; }
.token ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; color: #c3cbd6; font-size: 14px; }
/* icons cropped from the card art, or a drawn fallback until a card with that icon is added */
.badge-img { flex: none; display: block; border-radius: 50%; filter: drop-shadow(0 2px 5px rgba(0,0,0,.5)); }
.badge-img.role { width: 64px; height: 64px; }
.badge-img.style { width: 48px; height: 48px; margin-inline: 8px; }
.badge { flex: none; display: grid; place-items: center; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); box-shadow: 0 2px 8px rgba(0,0,0,.45); }
.badge svg { width: 64%; height: 64%; display: block; }
.badge.role { width: 64px; height: 64px; }
.badge.style { width: 48px; height: 48px; margin-inline: 8px; }

/* card picking stage: a full-screen glowing gradient that changes color with the step */
.stage { position: fixed; inset: 0; z-index: 5; overflow-y: auto; background: #070a14; color: #fff;
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bg { position: fixed; inset: 0; z-index: 0; opacity: 0; pointer-events: none; transition: opacity .9s ease;
  background-size: 160% 160%, 160% 160%, 100% 100%; background-repeat: no-repeat;
  animation: drift 16s ease-in-out infinite alternate, glow 7s ease-in-out infinite alternate; }
.bg-p1 { background-image: radial-gradient(circle at 30% 30%, rgba(76,96,255,.95), transparent 55%), radial-gradient(circle at 70% 70%, rgba(170,70,255,.85), transparent 55%), radial-gradient(circle at 50% 50%, #1c1560, #070618 85%); }
.bg-p2 { background-image: radial-gradient(circle at 30% 30%, rgba(255,50,60,.95), transparent 55%), radial-gradient(circle at 75% 70%, rgba(255,128,30,.7), transparent 50%), radial-gradient(circle at 50% 50%, #3a0a10, #12040a 85%); }
.bg-ban { background-image: radial-gradient(circle at 30% 30%, rgba(20,225,150,.9), transparent 55%), radial-gradient(circle at 70% 70%, rgba(25,190,240,.9), transparent 55%), radial-gradient(circle at 50% 50%, #06303a, #031318 85%); }
.bg-done { background-image: radial-gradient(circle at 25% 50%, rgba(76,96,255,.85), transparent 55%), radial-gradient(circle at 75% 50%, rgba(255,60,70,.8), transparent 55%), radial-gradient(circle at 50% 50%, #1a1030, #06060f 85%); }
.stage[data-mode="p1"] .bg-p1, .stage[data-mode="p2"] .bg-p2, .stage[data-mode="ban"] .bg-ban, .stage[data-mode="done"] .bg-done { opacity: 1; }
@keyframes drift { from { background-position: 0% 0%, 100% 100%, 0 0; } to { background-position: 100% 100%, 0% 0%, 0 0; } }
@keyframes glow { from { filter: brightness(.95); } to { filter: brightness(1.2); } }

.stage-inner { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; display: grid; gap: 18px; justify-items: center; }
.stage .btn.ghost { background: rgba(5,8,18,.5); border-color: rgba(255,255,255,.35); color: #fff; }
.d-top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.d-phase { font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.d-banner { width: 100%; background: rgba(5,8,18,.58); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 18px 20px; text-align: center; display: grid; gap: 8px; justify-items: center; backdrop-filter: blur(8px); }
.d-player { font-family: var(--f-title); letter-spacing: .08em; text-transform: uppercase; font-size: 15px; padding: 3px 16px; border-radius: 999px; border: 2px solid #fff; }
.d-player.p1 { background: #3f63ff; }
.d-player.p2 { background: #e63a3a; }
.d-action { font-size: clamp(32px, 7vw, 52px); line-height: 1; text-shadow: 0 2px 18px rgba(0,0,0,.5); }
.d-step { margin: 0; font-family: var(--f-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.88); }
.d-hint { margin: 0; font-size: 14px; color: rgba(255,255,255,.82); max-width: 52ch; }

.d-teams { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.team { background: rgba(5,8,18,.5); border: 1px solid; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; justify-content: center; gap: 8px 12px; flex-wrap: wrap; }
.team.p1 { border-color: rgba(120,150,255,.85); }
.team.p2 { border-color: rgba(255,120,120,.85); }
.team-name { font-family: var(--f-title); text-transform: uppercase; letter-spacing: .06em; font-size: 15px; }
.slots { display: flex; gap: 10px; }
.slot { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.38); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 14px; color: rgba(255,255,255,.55); }
.slot.filled { border-style: solid; border-color: #fff; color: #fff; }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; display: block; }
.slot.filled b { position: absolute; right: -7px; bottom: -7px; width: 21px; height: 21px; border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center; font-size: 12px; color: #fff; }
.team.p1 .slot.filled b { background: #3f63ff; }
.team.p2 .slot.filled b { background: #e63a3a; }

.d-grid { --tk: clamp(68px, 18vw, 104px); display: flex; flex-wrap: wrap; justify-content: center; gap: 22px 16px; width: 100%; padding-bottom: 8px; }
.token { width: var(--tk); padding: 0; border: 0; background: none; color: #fff; font: inherit; display: grid; gap: 7px; justify-items: center; align-content: start; cursor: pointer; transition: filter .35s ease; }
.token:focus-visible { outline: 3px solid #fff; outline-offset: 4px; border-radius: 12px; }
.tk-disc { position: relative; width: var(--tk); height: var(--tk); border-radius: 50%; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 6px 18px rgba(0,0,0,.5); transition: transform .15s ease, box-shadow .15s ease; }
.tk-disc img { display: block; width: 100%; height: 100%; border-radius: 50%; }
.token.free:hover .tk-disc, .token.free:focus-visible .tk-disc { transform: scale(1.1); box-shadow: 0 0 0 3px rgba(255,255,255,.55), 0 0 26px rgba(255,255,255,.55); }
.tk-name { font-size: 12px; line-height: 1.15; text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.85); max-width: calc(var(--tk) + 16px); }
.token.banned { filter: brightness(.28); cursor: not-allowed; }
.token.drafted, .token.locked { cursor: default; }
.token.drafted.p1 .tk-disc { border-color: #8fa6ff; box-shadow: 0 0 0 2px #3f63ff, 0 0 22px rgba(80,110,255,.8); }
.token.drafted.p2 .tk-disc { border-color: #ff9a9a; box-shadow: 0 0 0 2px #e63a3a, 0 0 22px rgba(255,80,80,.8); }
.pick { position: absolute; left: 50%; top: 50%; width: 48%; height: 48%; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-title); font-size: calc(var(--tk) * .27); line-height: 1; border: 3px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.65); animation: pop .3s ease; }
.pick.p1 { background: radial-gradient(circle at 35% 30%, #94aaff, #2e4fe0 70%); }
.pick.p2 { background: radial-gradient(circle at 35% 30%, #ff9f9f, #d92d2d 70%); }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

.peek { position: fixed; z-index: 8; pointer-events: none; opacity: .9; border-radius: 4.5%; box-shadow: 0 18px 50px rgba(0,0,0,.7); }
.confirm { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(4,6,14,.8);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.confirm-card { width: min(74vw, 300px); border-radius: 4.5%; opacity: .94; box-shadow: 0 18px 50px rgba(0,0,0,.7); }
.c-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* battle screen: Player 2 on the top half, Player 1 on the bottom half, roll / turn panel on the seam */
.arena { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; color: #fff; overflow: hidden;
  background: radial-gradient(ellipse 70% 45% at 50% 50%, #251a52 0%, transparent 70%), linear-gradient(180deg, #0a0614 0%, #11092a 38%, #14103a 50%, #0b1230 62%, #060a18 100%); }
.arena::before, .arena::after { content: ''; position: absolute; inset: -20%; pointer-events: none; z-index: 0; }
.arena::before { background: radial-gradient(circle at 18% 22%, rgba(214,64,96,.20), transparent 38%), radial-gradient(circle at 82% 30%, rgba(122,60,220,.28), transparent 40%); animation: mat-a 24s ease-in-out infinite alternate; }
.arena::after { background: radial-gradient(circle at 80% 78%, rgba(60,110,255,.24), transparent 38%), radial-gradient(circle at 22% 70%, rgba(30,190,200,.14), transparent 40%); animation: mat-b 30s ease-in-out infinite alternate; }
@keyframes mat-a { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(4%, 3%, 0) scale(1.1); } }
@keyframes mat-b { from { transform: translate3d(3%, 2%, 0) scale(1.05); } to { transform: translate3d(-4%, -3%, 0) scale(1); } }
.half { position: relative; z-index: 1; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: none; transition: box-shadow .4s ease, background .4s ease; }
.half.p2 { padding-top: max(46px, calc(env(safe-area-inset-top, 0px) + 40px)); padding-bottom: 78px; }
.half.p1 { padding-top: 78px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.arena .seam-line { position: absolute; z-index: 2; left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-1px); pointer-events: none; background: linear-gradient(90deg, transparent, rgba(255,120,140,.7), rgba(255,255,255,.75) 50%, rgba(110,140,255,.7), transparent); box-shadow: 0 0 18px rgba(170,130,255,.55); }
.half.lit { background: radial-gradient(ellipse 80% 70% at 50% 50%, rgba(255,255,255,.07), transparent 70%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 60px rgba(255,255,255,.10); }
.half-head { display: flex; align-items: center; gap: 10px; }
.half.p1 .half-head { order: 2; }
.first-badge { font-family: var(--f-title); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; background: #fff; color: #111; padding: 2px 11px; border-radius: 999px; animation: badge-in .35s ease; }
@keyframes badge-in { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.arena-menu { position: absolute; z-index: 6; top: max(10px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); padding: 6px 12px; min-height: 0; font-size: 13px; }
.arena .btn.ghost { background: rgba(5,8,18,.55); border-color: rgba(255,255,255,.35); color: #fff; }

/* hands: a card with its CET tokens tucked out from underneath it */
.hand-row { --bw: max(60px, min((100vw - 40px) / 3, (50vh - 186px) * .7143, 320px)); --td: clamp(20px, calc(var(--bw) * .25), 34px); display: flex; gap: clamp(8px, 2vw, 18px); justify-content: center; align-items: flex-start; }
.b-slot { width: var(--bw); display: grid; grid-template-columns: minmax(0, 1fr); }
.b-card { position: relative; z-index: 1; width: 100%; aspect-ratio: 750 / 1050; padding: 0; margin: 0; border: 0; background: none; border-radius: 4.5%; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.6); transition: transform .15s ease; }
.b-card img { display: block; width: 100%; height: 100%; border-radius: 4.5%; }
.b-card:hover, .b-card:focus-visible { transform: translateY(-4px); }
.b-card:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.b-card.lifted { visibility: hidden; }
.b-cet { position: relative; z-index: 0; display: flex; align-items: flex-end; min-height: var(--td); margin-top: calc(var(--td) * -.4); padding-left: 3px; min-width: 0; }
.cet-disc { flex: none; display: block; width: var(--td); height: var(--td); border-radius: 50%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
.cet-disc + .cet-disc { margin-left: calc(var(--td) * var(--ov, -.5)); }
.cet-count { position: relative; z-index: 2; margin-left: 4px; font-family: var(--f-mono); font-weight: 700; font-size: clamp(9px, calc(var(--bw) * .07), 11px); line-height: 1; padding: 3px 5px; border-radius: 999px; background: rgba(5,8,18,.82); border: 1px solid rgba(135,200,255,.6); color: #bfe4ff; white-space: nowrap; }

/* seam panel: roll-off, then turn controls */
.seam-panel { position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 24px)); background: rgba(6,8,22,.92); border: 1px solid rgba(255,255,255,.28); border-radius: 14px; padding: 8px 14px 10px; text-align: center; display: grid; gap: 8px; backdrop-filter: blur(8px); box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.seam-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.7); }
.seam-msg { margin: 0; font-size: 14px; min-height: 2.8em; display: grid; place-items: center; }
.roll-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
.roll-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.die-name { font-family: var(--f-title); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.roll-side.p1 .die-name { color: #a9b9ff; }
.roll-side.p2 .die-name { color: #ffadad; }
.roll-num { min-width: 64px; font-family: var(--f-title); font-size: 44px; line-height: 1.1; padding: 2px 10px; border-radius: 12px; border: 2px solid; background: rgba(255,255,255,.06); transition: background .3s ease, color .3s ease; }
.roll-side.p1 .roll-num { border-color: #3f63ff; color: #c4d0ff; }
.roll-side.p2 .roll-num { border-color: #e63a3a; color: #ffc6c6; }
.roll-num.empty { opacity: .4; }
.roll-num.win { background: #fff; color: #111; }
.die { width: 76px; height: 76px; border-radius: 16px; border: 0; background: #f5f5fa; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); place-items: center; padding: 11px; font: inherit; cursor: pointer; transition: transform .12s ease; box-shadow: 0 0 0 3px #fff; }
.die i { width: 12px; height: 12px; border-radius: 50%; }
.die i.on { background: #15151f; }
.die.blank { font-family: var(--f-title); font-size: 40px; color: #6d6d85; padding: 0; }
.die:disabled { cursor: default; }
.die:not(:disabled):hover { transform: scale(1.08); }
.die:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
.die.w1 { box-shadow: 0 0 0 3px #3f63ff, 0 0 22px rgba(80,110,255,.85); }
.die.w2 { box-shadow: 0 0 0 3px #e63a3a, 0 0 22px rgba(255,80,80,.85); }
.die.ready { animation: nudge 1.3s ease-in-out infinite; }
.die.rolling { animation: tumble .28s linear infinite; }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
@keyframes tumble { 0% { transform: rotate(-14deg) translateY(0); } 50% { transform: rotate(12deg) translateY(-6px); } 100% { transform: rotate(-14deg) translateY(0); } }
.turn-row { display: flex; align-items: center; justify-content: center; gap: 12px 16px; flex-wrap: wrap; }
.acts { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-title); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
.acts-n { font-size: 34px; line-height: 1; color: #ffd24a; margin-right: 2px; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.acts-n small { font-size: 18px; color: rgba(255,255,255,.7); }
.act { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); }
.act.on { background: #ffd24a; border-color: #ffd24a; box-shadow: 0 0 10px rgba(255,210,74,.7); }
.acts .acts-l { margin-left: 4px; }

/* open card: the card moves to the center, its CET tokens slide out on the right, the options sit on the left */
.bz { position: fixed; inset: 0; z-index: 12; }
.bz[hidden] { display: none; }
.bz-backdrop { position: absolute; inset: 0; z-index: 0; background: rgba(5,8,12,.86); opacity: 0; transition: opacity .3s ease; }
.bz.open .bz-backdrop { opacity: 1; }
.bz-card { position: fixed; z-index: 2; margin: 0; padding: 0; border: 0; background: none; cursor: zoom-out; border-radius: 4.5%; box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 40px rgba(135,147,255,.35); transition: left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), width .38s cubic-bezier(.2,.8,.2,1), height .38s cubic-bezier(.2,.8,.2,1); }
.bz-card img { display: block; width: 100%; height: 100%; border-radius: 4.5%; }
.bz-card:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
.bz-cet { position: fixed; z-index: 1; padding-left: 28px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; align-content: flex-start; overflow-y: auto; opacity: 0; transform: translateX(-70px); transition: opacity .3s ease .15s, transform .38s cubic-bezier(.2,.8,.2,1) .15s; }
.bz.open .bz-cet { opacity: 1; transform: none; }
.bz-cet-head { display: flex; align-items: baseline; gap: 8px; }
.bz-cet-label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #9fd2ff; }
.bz-cet-n { font-family: var(--f-title); font-size: 44px; line-height: 1; color: #fff; }
.bz-discs { display: grid; grid-template-columns: repeat(auto-fill, 38px); gap: 6px; width: 100%; max-width: 132px; }
.bz-cet.compact .bz-discs { grid-template-columns: repeat(auto-fill, 32px); max-width: none; }
.bz-disc { width: 100%; aspect-ratio: 1; display: block; border-radius: 50%; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
.bz-none { font-size: 13px; color: #8c98a8; }
.bz-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.bz-opts { position: fixed; z-index: 3; overflow-y: auto; background: var(--table); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transition: opacity .2s ease; }
.bz.open .bz-opts { opacity: 1; transition: opacity .3s ease .2s; }
.bz-head { display: grid; gap: 6px; justify-items: start; }
.bz-head h2 { font-size: 26px; line-height: 1.05; }
.bz-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.opt-list { display: grid; gap: 8px; }
.bz-opts.compact .opt-list { grid-template-columns: 1fr 1fr; }
.opt { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; width: 100%; min-height: 52px; padding: 9px 12px; text-align: left; font: inherit; color: #fff; background: #1d2e40; border: 1px solid #3e5670; border-radius: 10px; cursor: pointer; }
.opt:hover:not(:disabled) { background: #26405a; border-color: var(--accent); }
.opt:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.opt-label { font-weight: 700; font-size: 15px; }
.opt-cost { font-family: var(--f-mono); font-weight: 700; font-size: 13px; color: #8ad4ff; }
.opt-sub { grid-column: 1 / -1; font-size: 12.5px; color: #b9c4d2; }
.opt-why { grid-column: 1 / -1; font-size: 12px; color: #ffb4a6; }
.opt:disabled { cursor: not-allowed; background: #0a0f15; border-color: #17212c; }
.opt:disabled .opt-label { color: #5f6c7a; }
.opt:disabled .opt-cost { color: #3f5d70; }
.opt:disabled .opt-sub { color: #4d5967; }
.opt:disabled .opt-why { color: #d79a8f; }
.bz-close { align-self: flex-start; }

/* bold HP plate on each card, floating numbers, targets, domain banner */
.b-slot { position: relative; }
.b-hp { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); z-index: 2; display: grid; gap: 2px; min-width: 58%; white-space: nowrap; padding: 1px 7px 3px; border-radius: 12px; background: rgba(5,8,18,.9); border: 2px solid #fff; text-align: center; pointer-events: none; box-shadow: 0 3px 10px rgba(0,0,0,.6); }
.b-hp b { font-family: var(--f-title); font-weight: 400; font-size: clamp(12px, calc(var(--bw) * .115), 22px); line-height: 1.1; letter-spacing: .04em; color: #fff; text-shadow: 0 1px 0 #000; }
.b-hp .bar { display: block; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
.b-hp .bar i { display: block; height: 100%; border-radius: 3px; background: #4ade80; transition: width .4s ease; }
.b-hp.mid .bar i { background: #fbbf24; }
.b-hp.low .bar i { background: #f43f5e; }
.b-card.dead img { filter: grayscale(1) brightness(.35); }
.b-card.dead { cursor: default; }
.b-card.target { animation: tgt .9s ease-in-out infinite; outline: 3px solid #ffe066; outline-offset: 3px; }
@keyframes tgt { 0%, 100% { box-shadow: 0 0 6px 1px rgba(255,224,102,.55); } 50% { box-shadow: 0 0 26px 8px rgba(255,224,102,.95); } }
.tt-badge { position: absolute; z-index: 3; top: 3%; left: 3%; font-family: var(--f-mono); font-weight: 700; font-size: clamp(10px, calc(var(--bw) * .1), 15px); line-height: 1; padding: 3px 7px; border-radius: 999px; background: rgba(40,10,80,.92); border: 2px solid #b88aff; color: #e4d2ff; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.6); }
.tt-badge.grace { border-color: #ffd24a; color: #ffe9a0; }
.pop { position: absolute; z-index: 5; left: 50%; top: 18%; transform: translateX(-50%); pointer-events: none; font-family: var(--f-title); font-size: clamp(20px, calc(var(--bw) * .22), 40px); white-space: nowrap; color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); animation: pop 1.3s ease-out forwards; }
.pop.dmg { color: #ff5a5a; } .pop.heal { color: #6dffa0; } .pop.cet { color: #8ad4ff; } .pop.blk { color: #ffe066; } .pop.ko { color: #fff; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 14px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.25); } 30% { transform: translate(-50%, -4px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -46px) scale(1); } }
.half.dom { box-shadow: inset 0 0 0 3px rgba(190,120,255,.95), inset 0 0 70px rgba(170,90,255,.45); }
.half.lit.dom { box-shadow: inset 0 0 0 3px #fff, inset 0 0 70px rgba(170,90,255,.55); }
.dom-banner { position: absolute; z-index: 6; top: max(12px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); white-space: nowrap; max-width: calc(100% - 150px); overflow: hidden; text-overflow: ellipsis; font-family: var(--f-title); font-size: 15px; letter-spacing: .04em; padding: 4px 12px; border-radius: 999px; justify-self: center; background: linear-gradient(90deg, #6d28d9, #c026d3); color: #fff; }
.dom-banner b { font-weight: 400; opacity: .8; margin-right: 4px; }
.seam-panel.mini { gap: 4px; padding: 6px 12px 7px; width: min(520px, calc(100% - 24px)); }
.seam-panel.mini .turn-row { gap: 6px 12px; }
.seam-panel.mini .acts .acts-l { display: none; }
.seam-panel.mini .d-player { font-size: 14px; padding: 3px 12px; }
.seam-panel.mini .acts-n { font-size: 26px; }
.seam-panel.mini .act { width: 16px; height: 16px; }
.seam-panel.mini .btn { padding: 6px 14px; min-height: 0; }
.seam-msg.mini { min-height: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: 13px; line-height: 1.3; color: rgba(255,255,255,.88); }
.log-btn { background: none; border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.8); border-radius: 999px; font: 700 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; cursor: pointer; }
.log-pop { position: absolute; z-index: 7; left: 50%; top: calc(50% + 46px); transform: translateX(-50%); width: min(520px, calc(100% - 24px)); max-height: 40%; overflow-y: auto; background: rgba(6,8,22,.97); border: 1px solid rgba(255,255,255,.3); border-radius: 12px; padding: 10px 14px; display: grid; gap: 8px; font-size: 13px; box-shadow: 0 10px 40px rgba(0,0,0,.7); }
.log-pop p { margin: 0; color: rgba(255,255,255,.85); } .log-pop p:first-child { color: #fff; }

/* simple card animations: the card that acts steps toward the enemy, a hit one shakes and flashes, a healed one glows */
.fx-act { animation: fx-act .6s ease-out both; }
.half.p2 .fx-act { --dir: 1; } .half.p1 .fx-act { --dir: -1; }
@keyframes fx-act { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(calc(var(--dir, -1) * 22px)) scale(1.07); filter: brightness(1.25); } 100% { transform: translateY(0) scale(1); filter: none; } }
.fx-hurt .b-card { animation: fx-hurt .5s ease-out both; }
@keyframes fx-hurt { 0%, 100% { transform: translateX(0); filter: none; } 15% { transform: translateX(-8px); filter: brightness(1.7) saturate(1.5) drop-shadow(0 0 10px #ff3b4a); } 35% { transform: translateX(8px); } 55% { transform: translateX(-5px); filter: brightness(1.3) drop-shadow(0 0 8px #ff3b4a); } 75% { transform: translateX(3px); } }
.fx-heal .b-card { animation: fx-heal .8s ease-out both; }
@keyframes fx-heal { 0%, 100% { filter: none; } 35% { filter: brightness(1.25) drop-shadow(0 0 14px #5dffa0) drop-shadow(0 0 26px #5dffa0); } }
.fx-cet .b-card { animation: fx-cet .7s ease-out both; }
@keyframes fx-cet { 0%, 100% { filter: none; transform: scale(1); } 35% { filter: drop-shadow(0 0 12px #8ad4ff) drop-shadow(0 0 22px #8ad4ff); transform: scale(1.05); } }
.fx-blk .b-card { animation: fx-cet .7s ease-out both; }
.fx-ko .b-card { animation: fx-hurt .6s ease-out both; }
@media (prefers-reduced-motion: reduce) { .fx-act, .fx-hurt .b-card, .fx-heal .b-card, .fx-cet .b-card, .fx-blk .b-card, .fx-ko .b-card, .arena::before, .arena::after { animation: none; } }

/* end of the battle */
.end { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 40%, rgba(40,24,90,.82), rgba(3,4,12,.95) 75%); animation: end-in .7s ease .5s both; overflow-y: auto; }
@keyframes end-in { from { opacity: 0; } to { opacity: 1; } }
.end-box { width: min(620px, 100%); display: grid; gap: 14px; justify-items: center; text-align: center; }
.end-kicker { font-family: var(--f-mono); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.65); }
.end-h { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: clamp(38px, 9vw, 88px); line-height: 1.05; letter-spacing: .03em; text-transform: uppercase; }
.end-h.won { color: #ffd24a; text-shadow: 0 0 34px rgba(255,200,60,.55), 0 4px 0 rgba(0,0,0,.5); }
.end-h.lost { color: #9aa3c4; text-shadow: 0 4px 0 rgba(0,0,0,.5); }
.end-h.p1 { color: #a9b9ff; } .end-h.p2 { color: #ffadad; }
.end-teams { display: grid; gap: 8px; width: 100%; }
.end-team { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.end-team .tn { font-family: var(--f-title); letter-spacing: .06em; text-transform: uppercase; font-size: 15px; min-width: 90px; }
.end-team .tn.p1 { color: #a9b9ff; } .end-team .tn.p2 { color: #ffadad; }
.end-chip { display: grid; justify-items: center; gap: 2px; font: 700 11px var(--f-mono); color: #cdd6e6; }
.end-chip img { width: 54px; height: 54px; border-radius: 50%; border: 2px solid #fff; }
.end-chip.dead img { filter: grayscale(1) brightness(.5); border-color: #555; }
.end-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.opt-fx { grid-column: 1 / -1; font-size: 12.5px; color: #ffd9a8; }
.opt:disabled .opt-fx { color: #6b5a47; }
.bz-hp { font-family: var(--f-title); font-size: 22px; color: #fff; letter-spacing: .03em; }
.bz-hp b { font-weight: 400; font-size: 30px; }
.bz-act { font-family: var(--f-title); font-size: 18px; color: #ffd24a; }
.bz-act b { font-weight: 400; font-size: 26px; }

/* dice rolls for moves, coin flip, secret picks */
.roll-need { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.75); min-height: 1.3em; }
.roll-num.fail { background: rgba(255,80,80,.25); color: #ffb4b4; border-color: #ff5a5a; }
.dice-panel .seam-label { font-size: 12px; letter-spacing: .08em; line-height: 1.35; }
.pick-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.coin-wrap { display: grid; place-items: center; padding: 6px 0; perspective: 500px; }
.coin { width: 92px; height: 92px; border-radius: 50%; border: 5px solid #ffe28a; background: radial-gradient(circle at 35% 30%, #fff2b8, #d9a520 70%); color: #3a2a00; font-family: var(--f-title); font-size: 32px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 0 22px rgba(255,210,74,.6); padding: 0; }
.coin span { font-size: 24px; letter-spacing: .06em; text-transform: uppercase; }
.coin:disabled { cursor: default; }
.coin.flipping { animation: flip 1.2s ease-in-out; }
.coin.f1 { background: radial-gradient(circle at 35% 30%, #9db1ff, #3f63ff 70%); border-color: #c4d0ff; color: #fff; box-shadow: 0 0 26px rgba(80,110,255,.9); }
.coin.f2 { background: radial-gradient(circle at 35% 30%, #ffb0b0, #e63a3a 70%); border-color: #ffc6c6; color: #fff; box-shadow: 0 0 26px rgba(255,80,80,.9); }
@keyframes flip { 0% { transform: rotateY(0) translateY(0); } 50% { transform: rotateY(1440deg) translateY(-34px); } 100% { transform: rotateY(2880deg) translateY(0); } }
.b-card.chosen { outline: 4px solid #6dffa0; outline-offset: 3px; box-shadow: 0 0 28px 8px rgba(109,255,160,.8); }
.b-card.conf img { filter: grayscale(.7) brightness(.5); }

/* floating options beside the open card: the descriptions show on hover */
.opt-tip { display: none; }
.opt-wrap { display: block; }
.opt-wrap.off { cursor: not-allowed; }
.opt:disabled { pointer-events: none; }
.bz-opts.float { background: none; border: 0; padding: 4px; overflow: visible; }
.bz-opts.float .bz-head h2 { text-shadow: 0 2px 14px #000; }
.bz-opts.float .bz-meta { color: #dfe8f3; }
.bz-opts.float .opt-list { gap: 11px; }
.bz-opts.float .opt { min-height: 50px; padding: 8px 20px; border-radius: 999px; background: rgba(18,30,46,.88); border: 2px solid rgba(140,195,255,.55); box-shadow: 0 6px 20px rgba(0,0,0,.55), 0 0 16px rgba(110,170,255,.25); transition: transform .14s ease, box-shadow .14s ease, background .14s ease; }
.bz-opts.float .opt:hover:not(:disabled), .bz-opts.float .opt:focus-visible { transform: translateX(10px); background: rgba(36,64,96,.95); border-color: #bfe0ff; box-shadow: 0 8px 24px rgba(0,0,0,.6), 0 0 24px rgba(130,190,255,.6); }
.bz-opts.float .opt:disabled { background: rgba(8,12,18,.78); border-color: rgba(70,85,100,.5); box-shadow: none; }
.bz-opts.float .opt-sub, .bz-opts.float .opt-fx, .bz-opts.float .opt-why { display: none; }
.bz-opts.float .opt-tip { display: grid; gap: 4px; align-content: start; margin-top: 4px; min-height: 132px; padding: 12px 14px; border-radius: 14px; background: rgba(5,8,14,.92); border: 1px solid rgba(140,195,255,.35); box-shadow: 0 8px 26px rgba(0,0,0,.6); }
.tip-h { font-size: 16px; color: #fff; }
.tip-cost { font-family: var(--f-mono); font-size: 12px; color: #8ad4ff; margin-left: 6px; }
.tip-sub { font-size: 13px; color: #c3cfdd; }
.tip-fx { font-size: 13px; color: #ffd9a8; }
.tip-why { font-size: 13px; color: #ff9d8c; }
.tip-ok { font-size: 13px; color: #7dffb0; }

/* full-screen domain rules */
.info-ov { position: fixed; inset: 0; z-index: 30; overflow-y: auto; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 50% 30%, rgba(120,60,220,.55), rgba(8,4,24,0) 70%), #08041a; animation: infoin .45s ease; }
.info-ov.p1 { background: radial-gradient(circle at 50% 25%, rgba(70,90,255,.55), rgba(5,6,26,0) 72%), #05061c; }
.info-ov.p2 { background: radial-gradient(circle at 50% 25%, rgba(255,70,70,.5), rgba(24,5,8,0) 72%), #180508; }
@keyframes infoin { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
.info-box { width: min(980px, 100%); display: grid; gap: 10px; justify-items: center; text-align: center; }
.info-box h2 { font-family: var(--f-title); font-weight: 400; font-size: clamp(38px, 7vw, 76px); line-height: 1; letter-spacing: .03em; text-transform: uppercase; text-shadow: 0 4px 0 rgba(0,0,0,.5), 0 0 30px rgba(190,140,255,.8); }
.info-who { font-family: var(--f-mono); letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: rgba(255,255,255,.75); }
.info-lead { font-size: clamp(17px, 2.4vw, 24px); font-weight: 700; color: #ffe28a; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; width: 100%; margin-top: 8px; text-align: left; }
.info-grid section { background: rgba(5,8,18,.7); border: 1px solid rgba(255,255,255,.22); border-radius: 14px; padding: 14px 16px; }
.info-grid h3 { font-family: var(--f-title); font-weight: 400; letter-spacing: .06em; text-transform: uppercase; font-size: 18px; color: #c9b6ff; margin-bottom: 6px; }
.info-grid ul { list-style: none; display: grid; gap: 8px; padding: 0; margin: 0; }
.info-grid li { font-size: 15px; line-height: 1.4; color: #eef1f7; padding-left: 14px; position: relative; }
.info-grid li::before { content: ''; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: #ffd24a; }
.info-foot { display: grid; gap: 8px; justify-items: center; margin-top: 10px; min-height: 64px; }
.info-foot .btn:disabled { opacity: .55; cursor: wait; }
.info-bar { width: 220px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.2); position: relative; overflow: hidden; }
.info-bar::after { content: ''; position: absolute; inset: 0; background: #ffd24a; transform-origin: left; animation: infobar 3s linear forwards; }
@keyframes infobar { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* menu: username box and the Play drop-down */
.menu-list .btn[hidden] { display: none; }
.menu-list.rooms .drop { animation: drop-in .22s ease-out both; }
.menu-list.rooms .drop:nth-of-type(5) { animation-delay: .05s; }
.menu-list.rooms .drop:nth-of-type(6) { animation-delay: .1s; }
@keyframes drop-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
.menu-note { min-height: 20px; margin: 0; max-width: 320px; font-size: 14px; color: #ffb59b; }
.menu-note:empty { visibility: hidden; }
.uname { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; text-align: left; z-index: 5; }
.uname span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field { font: inherit; font-size: 16px; color: var(--fg); background: var(--table); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-height: 44px; width: 220px; max-width: calc(100vw - 32px); }
.field::placeholder { color: #5f6b7a; }
.field:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }

/* room screens */
.room-screen { display: grid; justify-items: center; align-content: start; gap: 16px; text-align: center; padding-block: clamp(24px, 9vh, 80px) 24px; }
.room-screen h2 { font-size: clamp(30px, 7vw, 46px); }
.room-card { width: 100%; max-width: 420px; display: grid; gap: 12px; }
.room-err { min-height: 20px; margin: 0; font-size: 14px; color: #ffb59b; }
.room-err:empty { visibility: hidden; }
.code-field { font-family: var(--f-mono); font-weight: 700; font-size: 30px; letter-spacing: .35em; text-align: center; padding-left: calc(12px + .35em); width: 100%; max-width: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row .btn { flex: 1 1 140px; }
.code-box { display: grid; gap: 6px; justify-items: center; }
.code-box small { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.code-big { font-family: var(--f-mono); font-weight: 700; font-size: clamp(38px, 11vw, 60px); letter-spacing: .22em; padding-left: .22em; line-height: 1.1; }
.ls-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 560px; }
.ls-slot { position: relative; display: grid; gap: 6px; padding: 16px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--table); min-width: 0; }
.ls-slot.p1 { border-color: #5a63d8; box-shadow: inset 0 0 28px rgba(105,92,230,.22); }
.ls-slot.p2 { border-color: #d8603c; box-shadow: inset 0 0 28px rgba(230,100,60,.2); }
.ls-slot.empty { border-style: dashed; box-shadow: none; }
.ls-role { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ls-name { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
.ls-slot.empty .ls-name { color: var(--muted); font-weight: 600; font-size: 16px; }
.ls-conn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--muted); }
.ls-conn::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #5f6b7a; }
.ls-conn.on { color: #8ff0b4; }
.ls-conn.on::before { background: #4be08a; box-shadow: 0 0 8px #4be08a; }
.ls-conn.off { color: #ffb59b; }
.ls-conn.off::before { background: #ff7a4d; }
.ls-conn.wait::before { animation: pulse 1.2s ease-in-out infinite; }
.ls-you { color: var(--accent); font-weight: 700; }
@keyframes pulse { 50% { opacity: .25; } }
.ls-status { margin: 0; color: var(--muted); min-height: 22px; }
.ls-actions { display: grid; gap: 10px; width: 100%; max-width: 320px; }
.match-box { width: 100%; max-width: 480px; padding: 16px; display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--table); font-family: var(--f-mono); font-size: 13px; text-align: left; }
.match-box b { color: var(--fg); }
.match-warn { margin: 0; padding: 10px 14px; border-radius: 8px; border: 1px solid #ff7a4d; background: rgba(255,122,77,.12); color: #ffd2c2; }
@media (max-width: 520px) { .ls-slots { grid-template-columns: 1fr; } }

/* online match: connection warning and refusal toast */
.net-bar { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 80; width: max-content; max-width: min(94vw, 560px); padding: 9px 16px; border-radius: 10px; text-align: center; background: #5a1f10; color: #ffd9cc; border: 1px solid #ff7a4d; font-weight: 600; font-size: 14px; pointer-events: none; box-shadow: 0 6px 22px rgba(0,0,0,.55); }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 90; max-width: min(92vw, 460px); padding: 10px 16px; border-radius: 10px; background: #1b2430; border: 1px solid var(--accent); color: var(--fg); box-shadow: 0 8px 28px rgba(0,0,0,.6); text-align: center; }
.info-wait { font-size: 13px; color: var(--muted); }
.coin button, .coin { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 520px) { .dom-banner { left: auto; right: 12px; transform: none; max-width: calc(100% - 150px); font-size: 13px; } .acts-n { font-size: 26px; } .acts { font-size: 12px; } .act { width: 18px; height: 18px; } .win-h { font-size: 30px; } .team { padding: 8px; } .slot { width: 40px; height: 40px; } .slots { gap: 8px; } .die { width: 64px; height: 64px; padding: 8px; } .die i { width: 10px; height: 10px; } .die.blank { font-size: 32px; } .roll-num { font-size: 34px; min-width: 48px; } .roll-row { gap: 8px; } .bz-opts { padding: 10px; } .opt { min-height: 48px; padding: 8px 10px; } .opt-label { font-size: 14px; } }
@media (prefers-reduced-motion: reduce) { .zoom-card, .zoom-backdrop, .zoom-info, .card-thumb, .bg, .token, .tk-disc, .half, .b-card, .bz-card, .bz-backdrop, .bz-cet, .bz-opts { transition: none !important; } .bg, .pick, .half, .die.rolling, .die.ready, .first-badge { animation: none !important; } }

<script id="server-rooms">
/* Online rooms: talks to the game server that served this page. The server keeps the rooms, runs the match
   and decides everything. This file only sends requests (fetch POST) and listens for updates (Server-Sent Events). */
(function (global) {
  'use strict';
  function cleanName(s) {
    return String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁦-⁩﻿<>&"']/g, '').replace(/\s+/g, ' ').trim().slice(0, 16);
  }
  function isCode(s) { return /^\d{6}$/.test(String(s)); }
  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .catch(function () {
        var m = location.protocol === 'file:'
          ? 'This page was opened as a file. Online play needs the game server: run start-windows.bat (or start-mac.command), then use the link it shows.'
          : 'Could not reach the game server.';
        return { ok: false, message: m, msg: m };
      });
  }
  function create() {
    var listeners = [], R = null, es = null;
    function emit() { var v = view(); listeners.forEach(function (f) { try { f(v); } catch (e) { console.error(e); } }); }
    function connect() {
      var url = '/api/events?token=' + encodeURIComponent(R.token);
      es = new EventSource(url);
      es.addEventListener('view', function (e) { try { R.sv = JSON.parse(e.data); } catch (x) { return; } if (R.sv.closed) R.closed = R.sv.closed; emit(); });
      es.addEventListener('state', function (e) {
        var st; try { st = JSON.parse(e.data); } catch (x) { return; }
        R.last = st; if (R.onState) R.onState(st);
      });
      es.onerror = function () {
        if (!R) return;
        if (es.readyState === 2) { if (!R.closed) R.closed = 'server'; emit(); }   // the server no longer knows this room
      };
    }
    function start(res, role, name) {
      if (!res.ok) return res;
      leave();
      R = { token: res.token, code: res.code, role: role, name: name, sv: null, closed: '', last: null, onState: null };
      connect(); emit();
      return { ok: true };
    }
    function leave() {
      if (!R) return;
      var o = R; R = null;
      try { es && es.close(); } catch (e) {}
      es = null;
      try { navigator.sendBeacon ? navigator.sendBeacon('/api/leave', new Blob([JSON.stringify({ token: o.token })], { type: 'application/json' })) : post('/api/leave', { token: o.token }); } catch (e) {}
    }
    function view() {
      if (!R) return null;
      var sv = R.sv, host = R.role === 'host';
      if (!sv) return { loading: true, code: R.code, role: R.role, closed: R.closed, players: [], match: null };
      var h = sv.host || { name: null, connected: false }, g = sv.guest || { name: null, connected: false };
      return {
        code: R.code, role: R.role, closed: R.closed, opponentLeft: !!sv.left && sv.left !== (host ? 1 : 2),
        canStart: host && !!sv.guest && g.connected && !sv.started,
        match: sv.started ? { players: [{ name: h.name }, { name: g.name }] } : null,
        players: [
          { slot: 1, label: 'Host', name: h.name, connected: h.connected, isMe: host },
          { slot: 2, label: 'Opponent', name: sv.guest ? g.name : null, connected: g.connected, isMe: !host }
        ]
      };
    }
    return {
      cleanName: cleanName, isCode: isCode, view: view,
      onChange: function (f) { listeners.push(f); },
      createRoom: function (name) { return post('/api/create', { name: name }).then(function (r) { return start(r, 'host', name); }); },
      joinRoom: function (code, name) { return post('/api/join', { code: code, name: name }).then(function (r) { return start(r, 'guest', name); }); },
      startMatch: function () { return R ? post('/api/start', { token: R.token }) : Promise.resolve({ ok: false, message: 'No room.' }); },
      leaveRoom: function () { leave(); return Promise.resolve(); },
      channel: function () {
        if (!R) return null;
        var me = R;
        return {
          act: function (a) { return post('/api/act', { token: me.token, action: a }); },
          onState: function (f) { me.onState = f; if (f && me.last) f(me.last); }
        };
      }
    };
  }
  global.ServerRooms = { create: create };
})(window);
</script>

  function place(el, r) {

    el.style.width = r.width + 'px'; el.style.height = r.height + 'px';

  // Narrow screens: card on top, info below it.
  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight, pad = 16;
    if (vw >= 760) {
      var gap = 24, pw = Math.min(380, Math.max(300, vw * 0.3));
      var w = Math.min((vh - 2 * pad) * ASPECT, 560, vw - 2 * pad - gap - pw);
      var h = w / ASPECT;
      var left = (vw - (w + gap + pw)) / 2, top = (vh - h) / 2;
      return { card: { left: left, top: top, width: w, height: h }, info: { left: left + w + gap, top: top, width: pw, height: h } };
    }
    var w2 = Math.min(vw - 2 * pad, vh * 0.5 * ASPECT), h2 = w2 / ASPECT;

      card: { left: (vw - w2) / 2, top: pad, width: w2, height: h2 },

    };
  }

  function openCard(thumb, c) {
    if (current) return;
    var from = thumb.getBoundingClientRect();
    var big = document.createElement('button');
    big.type = 'button';
    big.className = 'zoom-card';
    big.setAttribute('aria-label', 'Close enlarged ' + c.name);
    big.innerHTML = '<img src="' + c.src + '" alt="' + c.alt + '">';
    place(big, from);
    var info = document.createElement('aside');
    info.className = 'zoom-info';
    info.setAttribute('aria-label', c.name + ' details');
    info.innerHTML = infoHTML(c);
    var L = layout();
    place(info, L.info);
    zoom.appendChild(info);
    zoom.appendChild(big);
    zoom.hidden = false;
    current = { thumb: thumb, big: big, info: info, closing: false };
    thumb.classList.add('lifted');
    big.offsetWidth; // let the start position apply before animating
    zoom.classList.add('open');
    place(big, L.card);
    big.focus({ preventScroll: true });
    big.addEventListener('click', closeCard);
  }

  function closeCard() {
    if (!current || current.closing) return;
    var cur = current;
    cur.closing = true;
    zoom.classList.remove('open');
    place(cur.big, cur.thumb.getBoundingClientRect());
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      cur.thumb.classList.remove('lifted');
      cur.big.remove();
      cur.info.remove();
      zoom.hidden = true;
      current = null;
      cur.thumb.focus({ preventScroll: true });
    }
    cur.big.addEventListener('transitionend', function (e) { if (e.propertyName === 'width') finish(); });
    setTimeout(finish, 500);
  }

      if (d.spec.jackpot) { s.fx.jackpot = false; s.fx.jmin = 6; }
      if (d.spec.selfRestrictAfter) s.restrict = d.spec.selfRestrictAfter;
      if (d.spec.noDomainAfter) b.noDomain = d.spec.noDomainAfter;
      if (d.spec.ctLossAfter) s.tok.ct = Math.max(0, s.tok.ct - d.spec.ctLossAfter);
      b.domain = null;
    }

    // A clash (domain or beam): two opposing sides used the same kind of power within 1 turn of each other.
    // Both roll against their card's requirement. Both meeting it twice in a row goes to CET, then HP %, then a coin.
    // If only one of them meets it, that side wins. If neither does, roll again. cb gets true when s wins.
    function clashRolls(label, s, needN, old, needO, say, cb) {
      var b = battle, oc = b.cards[old.id], nName = cardDef(s.id).name, oName = cardDef(old.id).name, streak = 0;
      say.push(label.toUpperCase() + '! ' + nName + ' vs ' + oName + '.');
      function round() {
        rollDice(label + '! ' + nName + ' needs ' + needN + '+, ' + oName + ' needs ' + needO + '+' + (streak ? ' · both passed, one more time' : ''),
          [{ p: s.p, need: needN }, { p: old.p, need: needO }], function (v) {
            var a = v[0] >= needN, c = v[1] >= needO;
            if (a && c) { streak++; if (streak >= 2) return tiebreak(); return round(); }
            if (a !== c) { say.push((a ? nName : oName) + ' passed the roll and the other failed.'); return cb(a); }
            say.push('Neither passed, so they rolled again.'); streak = 0; round();
          });
      }
      function tiebreak() {
        var cn = s.cet, co = oc.cet;
        say.push('Both passed twice in a row.');
        if (cn !== co) { say.push((cn > co ? nName : oName) + ' wins with more CET (' + cn + ' vs ' + co + ').'); return cb(cn > co); }
        var l = s.hp * oc.max, r = oc.hp * s.max, pn = Math.round(100 * s.hp / s.max), po = Math.round(100 * oc.hp / oc.max);
        if (l !== r) { say.push('CET tied. ' + (l > r ? nName : oName) + ' wins with more HP % (' + pn + '% vs ' + po + '%).'); return cb(l > r); }
        say.push('CET and HP % are both tied. Coin flip!');
        flipCoin(label + ' tiebreaker: flip the coin', function (face) { say.push('The coin landed on Player ' + face + '.'); cb(face === s.p); });
      }
      round();
    }
    function clash(s, sp, old, say, cb) { clashRolls('Domain Clash', s, sp.clash || 3, old, old.spec.clash || 3, say, cb); }

    // Opens a domain (after a Domain Clash if needed). Pushes sentences onto say, then calls done.
    function openDomain(s, m, sp, tid, say, done) {
      var b = battle, name = cardDef(s.id).name, old = b.domain;
      function open() {
        var turns = sp.turnsByEnemies ? Math.max(1, Math.min(3, 4 - L(foe(s.p)).length)) : sp.turns;
        b.domain = { id: s.id, p: s.p, name: m.name, left: turns, total: turns, spec: sp, universal: !!sp.universal, turnCount: b.turnCount,
          trial: sp.trial ? { def: tid, left: turns, streak: 0 } : null };
        say.push(name + ' opened ' + m.name + (sp.trial ? ' with ' + cardDef(tid).name + ' on trial' : '') + ' for ' + turns + ' ' + (sp.universal ? 'universal ' : '') + 'turn' + (turns === 1 ? '' : 's') + '.');
        if (sp.heal) { var h = Math.min(s.max - s.hp, sp.heal); s.hp += h; pop(s.id, '+' + h + ' HP', 'heal'); }
        if (sp.loseCet) s.cet = 0;
        if (sp.limitlessDown) { s.fx.limitless = false; s.lockUntil.pas = b.turnNo[s.p] + 2; }
        if (sp.ctReset) s.tok.ct = 1;
        if (sp.restrictAll) say.push('Every enemy is restricted.');
        if (sp.noEnemyGain) say.push('Enemies can’t gain CET.');
        var steps = [];
        if (sp.jackpot) steps.push(function (next) { s.fx.jmin = 6; jackpotRoll(s, function (t) { say.push(t); next(); }); });
        if (sp.dmgRoll) steps.push(function (next) {
          rollDice(m.name + ': roll for damage (30 × the roll)', [{ p: s.p }], function (v) {
            var dmg = sp.dmgRoll * v[0], tg = L(foe(s.p)).map(function (id) { return b.cards[id]; });
            say.push('It rolled ' + v[0] + ' for ' + dmg + ' damage.');
            ryuGate(s, tg, function () { return dmg; }, function () {
              tg.forEach(function (c2) {
                var r2 = hit(s, c2, dmg), who = r2.by ? cardDef(r2.by.id).name : cardDef(c2.id).name;
                say.push(who + (r2.blocked ? ' blocked it with Limitless.' : ' took ' + r2.dealt + (r2.killed ? ' and is executed!' : '.')));
              });
              next();
            });
          });
        });
        function run(i) { if (i >= steps.length) return done(); steps[i](function () { run(i + 1); }); }
        if (DOM_INFO[s.id]) showInfo(s.p, s.id, function () { run(0); }); else run(0);
      }
      if (old && old.p !== s.p) {
        clash(s, sp, old, say, function (won) {
          if (!won) {
            // a failed clash does not count as a use
            s.used.dom = Math.max(0, (s.used.dom || 0) - 1); delete s.lockUntil.dom;
            say.push(name + '’s domain failed to open. It does not count as a use.');
            return done();
          }
          say.push(cardDef(old.id).name + '’s domain was broken.');
          closeDomain(); open();
        });
      } else open();
    }

    /* ----- the Lawyer's trial (Deadly Sentencing) ----- */
    // One round: the Lawyer picks in secret, the defendant answers, then the defendant rolls.
    // The Lawyer's pick lives only in this function. It is never part of a published state.
    function runTrial(notes, done) {
      var b = battle, d = b.domain, tr = d.trial, Lw = b.cards[d.id], D = b.cards[tr.def];
      var lName = cardDef(Lw.id).name, dName = cardDef(D.id).name;
      if (D.dead) { closeDomain(); return done(); }
      function opts() { return ['confess', 'silence', 'deny'].map(function (k) { return { k: k, label: TRIAL[k].label + ' (roll ' + TRIAL[k].need + '+)' }; }); }
      function answer(lk) {
        askPick('Trial of ' + dName + ': pick your answer', D.p, opts(),
          online ? lName + ' has already chosen in secret.' : 'Player ' + Lw.p + ', look away!', function (dk) {
            var same = lk === dk, need = TRIAL[dk].need + (same ? 1 : 0);
            notes.push('Trial: ' + lName + ' chose ' + TRIAL[lk].label + ', ' + dName + ' chose ' + TRIAL[dk].label + (same ? ' (same choice, +1 to the roll)' : '') + '.');
            rollDice('Trial: ' + TRIAL[lk].label + ' vs ' + TRIAL[dk].label + (same ? ' · same choice, +1' : '') + '. ' + dName + ' needs ' + need + '+', [{ p: D.p, need: need }], function (v) {
              var ok = v[0] >= need;
              notes.push(dName + ' rolled ' + v[0] + (ok ? ' and passed.' : ' and failed.'));
              tr.left -= 1;
              if (ok) {
                tr.streak++;
                if (dk === 'confess') { tr.left -= 3; notes.push('The trial is cut short by 3 more turns.'); }
                if (dk === 'deny') { tr.left -= 1; notes.push('The trial is cut short by 1 more turn.'); }
              } else {
                tr.streak = 0;
                if (dk === 'confess' || dk === 'deny') {
                  var turns = dk === 'confess' ? 3 : 2;
                  if (dk === 'confess') { Lw.fx.deathPenalty = true; pop(Lw.id, 'Death Penalty', 'ko'); notes.push('DEATH PENALTY is active!'); }
                  D.confiscated = turns; pop(D.id, 'Confiscated', 'blk');
                  notes.push(dName + ' is confiscated for ' + turns + ' turns and the domain ends.');
                  if (dk === 'deny') return endTrial(Lw, D, notes, done);
                  closeDomain(); return done();
                }
                Lw.tok.lt = Math.min(5, Lw.tok.lt + 1); tr.left += 1; pop(Lw.id, '+1 LT', 'cet');
                notes.push(lName + ' gained 1 Lawyer Token and the trial runs 1 turn longer.');
              }
              if (tr.streak >= 3) {
                Lw.fx.domBlockUntil = b.turnNo[Lw.p] + 5;
                notes.push(dName + ' was found innocent after 3 passes in a row! Deadly Sentencing is locked for 5 turns.');
                closeDomain(); return done();
              }
              if (tr.left <= 0) { notes.push('The trial ended with no verdict.'); return endTrial(Lw, D, notes, done); }
              d.left = tr.left; done();
            });
          });
      }
      askPick('Trial of ' + dName + ': ' + lName + ' secretly picks an action', Lw.p, opts(),
        online ? 'Your pick stays hidden from your opponent until both have chosen.' : 'Player ' + D.p + ', look away! Your pick stays hidden until both have chosen.', function (lk) {
          if (online) return answer(lk);
          askPick('Locked in!', D.p, [{ k: 'ok', label: 'Player ' + D.p + ' is ready' }], 'Pass the screen to Player ' + D.p + '.', function () { answer(lk); });
        });
    }

    // After a trial that did not end in the Death Penalty, the defendant's player may demand one retrial per card.
    function endTrial(Lw, D, notes, done) {
      var b = battle, d = b.domain, sp = d.spec, dName = cardDef(D.id).name;
      closeDomain();
      if (Lw.dead || D.dead || Lw.fx.deathPenalty || D.fx.retried) return done();
      askPick('Retrial?', D.p, [{ k: 'yes', label: 'Demand a retrial' }, { k: 'no', label: 'Accept the verdict' }],
        dName + ' was not sentenced to death. Player ' + D.p + ' may demand one retrial for this card: a fresh ' + sp.turns + '-turn trial. Pass 3 rolls in a row to be found innocent, but a failed Confess still means the Death Penalty.',
        function (k) {
          if (k !== 'yes') return done();
          D.fx.retried = true;
          b.domain = { id: Lw.id, p: Lw.p, name: d.name, left: sp.turns, total: sp.turns, spec: sp, universal: false, turnCount: b.turnCount, trial: { def: D.id, left: sp.turns, streak: 0 } };
          notes.push(dName + ' demanded a retrial! A new trial begins.');
          done();
        });
    }

    // Executioner's Sword: up to 3 rounds of both rolling, the Lawyer needs to win just one.
    function executioner(s, tid, say, done) {
      var b = battle, T = b.cards[tid], round = 0, tn = cardDef(tid).name;
      function next() {
        round++;
        rollDice('Executioner’s Sword, round ' + round + ' of 3: higher roll wins (a tie does nothing)', [{ p: s.p }, { p: T.p }], function (v) {
          if (v[0] === v[1]) { say.push('The roll tied, so nothing happened. Death Penalty is still active.'); return done(); }
          if (v[0] > v[1]) {
            s.fx.deathPenalty = false;
            hit(s, T, T.hp, true);
            say.push(cardDef(s.id).name + ' won a round. ' + tn + ' is executed! Death Penalty is over.');
            return done();
          }
          if (round >= 3) { s.fx.deathPenalty = false; say.push(tn + ' won all 3 rounds and survived. Death Penalty is over.'); return done(); }
          say.push(tn + ' won round ' + round + '.');
          next();
        });
      }
      next();
    }

    function checkWin() {
      var b = battle;
      [1, 2].forEach(function (p) {
        if (b.phase !== 'over' && !L(p).length) { b.phase = 'over'; b.winner = foe(p); b.domain = null; }
      });
    }

    /* ---------- using a card option ---------- */
    // Moves that need a target wait on the table for one (b.pending). Everything else resolves at once.
    function perform(seat, id, key) {
      var b = battle;
      if (!b || b.phase !== 'play') return no('The battle is not in progress.');
      if (typeof id !== 'string' || !b.cards[id] || OPTS.indexOf(key) < 0) return no('Unknown card or option.');
      var s = b.cards[id];
      if (s.p !== seat) return no('That is not your card.');
      if (seat !== b.turn) return no('It is not your turn.');
      if (busy()) return no('Finish what is happening first.');
      var o = optInfo(b, s, key);
      if (o.why) return no(o.why);
      var name = cardDef(id).name;
      if (key === 'gain') {
        var g = addCet(s, gainOf(s));
        s.gained = true;
        if (GAIN_COSTS_ACTION) b.actions--;
        pop(id, '+' + g + ' CET', 'cet');
        setMsg(name + ' gained ' + g + ' CET.' + (b.actions < 1 ? ' No actions left. End your turn.' : ''));
        pub();
        return { ok: true };
      }
      var sp = spec(id, key);
      if (sp.t === 'choice') {
        // a move with two ways to use it asks first. Nothing is spent until the choice is made.
        var avail = sp.modes.filter(function (m) { return !m.req || !m.req(s, b); });
        if (avail.length === 1) return startMove(id, key, avail[0]), { ok: true };
        var opts = avail.map(function (m) { return { k: m.k, label: m.label }; }).concat([{ k: 'cancel', label: 'Cancel' }]);
        askPick(BD[id][key].name + ': choose how to use it', seat, opts, 'Nothing is spent until you have chosen.', function (k) {
          var md = null;
          avail.forEach(function (m) { if (m.k === k) md = m; });
          if (!md) { b.msg = 'Cancelled. Nothing was spent.'; return pub(); }
          startMove(id, key, md);
        });
        return { ok: true };
      }
      startMove(id, key, null);
      return { ok: true };
    }
    // Moves that need a target wait on the table for one (b.pending). Everything else resolves at once.
    function startMove(id, key, mode) {
      var b = battle, s = b.cards[id], sp = merged(spec(id, key), mode);
      // a beam used right after an enemy beam clashes with it, so the clash picks the target
      var bf = sp.beam ? beamFoe(b, s) : null;
      if (bf) return resolve(id, key, sp.t === 'one' ? bf.id : null, mode);
      var needs = sp.t === 'one' || sp.t === 'ally' || sp.t === 'multi';
      if (needs) {
        var pool = sp.t === 'ally' ? L(s.p) : L(foe(s.p));
        if (pool.length > 1) {
          b.pending = { id: id, key: key, pool: pool, multi: sp.t === 'multi', sel: [], mode: mode };
          b.msg = sp.t === 'multi' ? 'Pick 1 to 3 targets for ' + BD[id][key].name + ', then confirm.' : sp.t === 'ally' ? 'Pick who gets healed.' :
            key === 'dom' ? 'Pick who goes on trial.' : 'Pick a target for ' + BD[id][key].name + '.';
          pub();
          return;
        }
        return resolve(id, key, sp.t === 'multi' ? [pool[0]] : pool[0], mode);
      }
      resolve(id, key, null, mode);
    }
    function pendingFor(seat) {
      var b = battle, pd = b && b.pending;
      if (!pd) return { err: no('Nothing is waiting for a target.') };
      if (seat !== b.turn || b.cards[pd.id].p !== seat) return { err: no('It is not your turn.') };
      return { pd: pd };
    }
    function pickTarget(seat, id) {
      var r = pendingFor(seat); if (r.err) return r.err;
      var pd = r.pd;
      if (typeof id !== 'string' || pd.pool.indexOf(id) < 0) return no('Pick one of the glowing cards, or cancel.');
      if (pd.multi) {
        var ix = pd.sel.indexOf(id);
        if (ix > -1) pd.sel.splice(ix, 1); else pd.sel.push(id);
        var n = pd.sel.length, tot = 60;
        battle.msg = n ? n + ' chosen: ' + Math.floor(tot / n) + ' damage each. Confirm when ready.' : 'Pick 1 to 3 targets for ' + BD[pd.id][pd.key].name + ', then confirm.';
        pub();
        return { ok: true };
      }
      battle.pending = null; resolve(pd.id, pd.key, id, pd.mode);
      return { ok: true };
    }
    function confirmTargets(seat) {
      var r = pendingFor(seat); if (r.err) return r.err;
      var pd = r.pd;
      if (!pd.multi || !pd.sel.length) return no('Pick at least one target.');
      battle.pending = null; resolve(pd.id, pd.key, pd.sel.slice(), pd.mode);
      return { ok: true };
    }
    function cancelPending(seat) {
      var r = pendingFor(seat); if (r.err) return r.err;
      battle.pending = null; battle.msg = 'Cancelled. Nothing was spent.'; pub();
      return { ok: true };
    }

    function conclude(s, say) {
      var b = battle;
      b.notes.forEach(function (n) { say.push(n); }); b.notes = [];
      if (s.id === 'restless-gambler' && !s.fx.jackpot) s.tok.ret = Math.min(6, s.tok.ret + 1);
      checkWin();
      if (b.phase === 'over') say.push('Player ' + b.winner + ' wins!');
      else if (b.actions < 1) say.push('No actions left. End your turn.');
      b.pending = null;
      setMsg(say.join(' '));
      pub();
    }

    function resolve(id, key, tid, mode) {
      var b = battle, s = b.cards[id], bd = BD[id], m = bd[key], sp = merged(spec(id, key), mode), name = cardDef(id).name, say = [];
      var cost = costOf(b, s, key, m);
      s.cet -= cost; s.moved = true; s.moves++; s.used[key] = (s.used[key] || 0) + 1;
      if (m.lock) s.lockUntil[key] = b.turnNo[s.p] + m.lock;
      b.actions--;
      pop(id, '', 'act');
      say.push(name + ' used ' + m.name + (cost ? ' (−' + cost + ' CET)' : '') + '.');

      if (key === 'dom') return openDomain(s, m, sp, tid, say, function () { conclude(s, say); });
      if (sp.exec) return executioner(s, tid, say, function () { conclude(s, say); });

      // Pure Love Beam: in exchange, Rika is disabled until the end of this card's next turn
      if (sp.rikaOff) { s.fx.summoned = false; s.fx.rikaOff = sp.rikaOff + 1; }
      // Beam Clash: a beam used within 1 turn of an enemy beam. Same dice rules as a Domain Clash.
      var oldBeam = sp.beam ? beamFoe(b, s) : null;
      if (sp.beam) b.lastBeam = { id: s.id, p: s.p, turnCount: b.turnCount };
      if (oldBeam) {
        var oc = b.cards[oldBeam.id];
        return clashRolls('Beam Clash', s, sp.beam, { id: oc.id, p: oc.p }, spec(oc.id, 'm3').beam || 3, say, function (won) {
          if (!won) { say.push(name + '’s beam was overpowered and did no damage.'); return conclude(s, say); }
          var dmg = sp.beamDmg || sp.dmg || 0;
          say.push(name + ' won the Beam Clash!');
          ryuGate(s, [oc], function () { return dmg; }, function () {
            var r2 = hit(s, oc, dmg), who = r2.by ? cardDef(r2.by.id).name : cardDef(oc.id).name;
            say.push(r2.blocked ? who + ' blocked it with Limitless.' : who + ' took ' + r2.dealt + ' damage' + (r2.killed ? ' and is executed!' : '.'));
            conclude(s, say);
          });
        });
      }

      var extra = 0;
      function go() {
        var targets = [], attack = !!(sp.dmg || sp.dmgPerTok);
        if (sp.t === 'one' && tid) targets = [b.cards[tid]];
        else if (sp.t === 'multi' && tid) targets = tid.map(function (i) { return b.cards[i]; });
        else if (sp.t === 'all') targets = L(foe(s.p)).map(function (i) { return b.cards[i]; });
        var base = (sp.dmg || 0) + extra;
        if (sp.dmgPerTok) base = sp.dmgPerTok.n * s.tok[sp.dmgPerTok.k];
        if (sp.streak && tid) { if (s.fx['last_' + key] === tid) base = sp.streak; s.fx['last_' + key] = tid; }
        var bonus = (id === 'restless-gambler' ? 5 * s.tok.ret : 0) + (id === 'defensive-lawyer' ? 5 * s.tok.lt : 0) + (id === 'volcano-head' && s.fx.rageBurst > 0 ? 20 : 0);
        function dmgFor(t) {
          var dmg = base + bonus;
          if (sp.t === 'multi') dmg = Math.floor(dmg / targets.length);
          if (sp.lowHp && t.hp < sp.lowHp.hp) dmg = sp.lowHp.dmg;
          return dmg;
        }
        function finish() {
          if (sp.heal) {
            var who = sp.t === 'ally' && tid ? b.cards[tid] : s;
            var hh = Math.min(who.max - who.hp, sp.heal);
            who.hp += hh; pop(who.id, '+' + hh + ' HP', 'heal');
            var mh = b.cards['perfect-soul'];
            if (hh > 0 && mh && !mh.dead && mh.p !== who.p && who.tok.tt > 0) { who.tok.tt--; say.push(cardDef(who.id).name + ' lost 1 Transfiguration Token from the healing.'); }
            say.push(cardDef(who.id).name + ' healed ' + hh + ' HP.');
          }
          if (sp.copy) { s.fx.copied = (s.fx.copied || 0) + sp.copy; say.push(name + ' copied a move (' + s.fx.copied + ' copied so far). Using copied moves isn’t built yet.'); }
          if (sp.tt) targets.forEach(function (t) { if (!t.dead) { t.tok.tt += sp.tt; pop(t.id, '+' + sp.tt + ' TT', 'cet'); say.push(cardDef(t.id).name + ' now has ' + t.tok.tt + ' Transfiguration Token' + (t.tok.tt === 1 ? '' : 's') + '.'); } });
          if (sp.limitlessDown) s.fx.limitless = false;
          if (sp.ct) s.tok.ct = Math.min(15, s.tok.ct + sp.ct);
          if (sp.lt) s.tok.lt = Math.max(0, Math.min(5, s.tok.lt + sp.lt));
          if (sp.oh) { s.tok.oh = Math.min(5, s.tok.oh + sp.oh); say.push(name + ' now has ' + s.tok.oh + ' Overheat Token' + (s.tok.oh === 1 ? '' : 's') + '.'); }
          if (sp.ohDown) { s.tok.oh = Math.max(0, s.tok.oh - sp.ohDown); say.push(name + ' now has ' + s.tok.oh + ' Overheat Token' + (s.tok.oh === 1 ? '' : 's') + '.'); }
          if (sp.t === 'none') say.push('(Its extra effect isn’t built yet.)');
          conclude(s, say);
        }
        if (attack) {
          ryuGate(s, targets, dmgFor, function () {
            if (sp.t === 'multi') say.push(targets.length + ' target' + (targets.length === 1 ? '' : 's') + ': ' + Math.floor((base + bonus) / targets.length) + ' damage each.');
            targets.forEach(function (t) {
              var res = hit(s, t, dmgFor(t)), tn = res.by ? cardDef(res.by.id).name : cardDef(t.id).name;
              say.push(res.blocked ? tn + ' blocked it with Limitless.' : tn + ' took ' + res.dealt + ' damage' + (res.killed ? ' and is executed!' : '.'));
              if (sp.restrict && !t.dead && !res.blocked) t.restrict = Math.max(t.restrict, sp.restrict);
            });
            var d = b.domain;
            if (d && d.spec.retaliate && d.p !== s.p && !s.dead) {
              var rr = hit({ p: d.p, id: d.id }, s, d.spec.retaliate);
              say.push(name + ' took ' + rr.dealt + ' damage from ' + d.name + (rr.killed ? ' and is executed!' : '.'));
            }
            finish();
          });
        } else {
          if (sp.restrict) targets.forEach(function (t) { t.restrict = Math.max(t.restrict, sp.restrict); say.push(cardDef(t.id).name + ' is restricted for ' + sp.restrict + ' turns.'); pop(t.id, 'Restricted', 'blk'); });
          finish();
        }
      }
      if (sp.bonusRoll) {
        rollDice(m.name + ': roll ' + sp.bonusRoll.min + '+ for +' + sp.bonusRoll.dmg + ' damage', [{ p: s.p, need: sp.bonusRoll.min }], function (v) {
          if (v[0] >= sp.bonusRoll.min) { extra = sp.bonusRoll.dmg; say.push('Rolled ' + v[0] + ': +' + sp.bonusRoll.dmg + ' damage.'); }
          else say.push('Rolled ' + v[0] + ': no bonus.');
          go();
        });
      } else go();
    }
